# Optional: real Postgres + separate API and worker processes (closest to hosted).
# The default `npm run dev` needs none of this — it uses embedded Postgres (PGlite).
#
#   docker compose up -d db          # just Postgres; then set DATABASE_URL in .env and `npm run dev`
#   docker compose up --build        # everything in containers (reads secrets from .env)
services:
  db:
    image: postgres:17
    environment: { POSTGRES_USER: adlab, POSTGRES_PASSWORD: adlab, POSTGRES_DB: adlab }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "adlab"], interval: 2s, retries: 20 }

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://adlab:adlab@db:5432/adlab
      ADLAB_INLINE_WORKER: "false"
      ADLAB_DATA_DIR: /data
    ports: ["8787:8787"]
    volumes: [adlabdata:/data]
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: .
    command: ["npx", "tsx", "apps/worker/src/main.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://adlab:adlab@db:5432/adlab
      ADLAB_DATA_DIR: /data
    volumes: [adlabdata:/data]
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
  adlabdata:
